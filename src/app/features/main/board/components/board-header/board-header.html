<h2>Board</h2>
<app-select-field
  variant="search"
  placeholder="Find Task"
  emptyText="No tasks found."
  [options]="taskService.sortedTasks()"
  [labelFn]="taskLabelFn"
  [getSearchStrings]="taskTitleSearch"
  [getIncludeStrings]="taskDescriptionSearch"
  (valueChange)="onTaskSelected($event)"
/>
<!-- added method dialogService.openAddTask() in click (new in DialogService)-->
<button appBtn preset="addTask" (click)="dialogService.openAddTask()"></button>
