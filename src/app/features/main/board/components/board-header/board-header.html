<header class="board-header" [class.header-mobile]="responsiveService.isMobile()">
  <h2>Board</h2>

  <div class="board-header__actions">
    <label class="search">
      <input type="text" placeholder="Find Task" />
      <span class="search__divider"></span>
      <svg class="search__icon">
        <use href="./assets/icons/icons.svg#search"></use>
      </svg>
    </label>

    <button
      appBtn
      preset="addTask"
      [size]="responsiveService.isMobile() ? 'small' : 'large'"
      [class.is-mobile]="responsiveService.isMobile()"
      [class.is-tablet]="responsiveService.isTablet()"
      [class.is-desktop]="responsiveService.isDesktop()"
      type="button"
    ></button>
  </div>
</header>
