<div class="title-group">
  <h2>Board</h2>
  @if (taskService.boardFilter(); as filter) {
    <button
      appBtn
      preset="cancel"
      size="small"
      iconPos="right"
      (click)="taskService.clearBoardFilter()"
    >
      {{ filter.label }}
    </button>
  }
</div>
<app-select-field
  variant="search"
  placeholder="Find Task"
  aria-label="Search tasks"
  emptyText="No tasks found."
  [options]="taskService.sortedTasks()"
  [labelFn]="taskLabelFn"
  [getSearchStrings]="taskTitleSearch"
  [getIncludeStrings]="taskDescriptionSearch"
  (valueChange)="onTaskSelected($event)"
/>
<!-- added method dialogService.openAddTask() in click (new in DialogService)-->
<button
  appBtn
  preset="addTask"
  ariaLabel="Add new task"
  (click)="taskService.openAddTask()"
></button>
