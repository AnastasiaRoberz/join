<div class="title-group">
  <h2>Board</h2>
  @if (taskService.boardFilter(); as filter) {
    <button
      appBtn
      preset="cancel"
      size="small"
      iconPos="right"
      class="filter-btn"
      (click)="taskService.clearBoardFilter()"
    >
      {{ filter.label }}
    </button>
  }
</div>
<app-select-field
  variant="search"
  placeholder="Find Task"
  aria-label="Search tasks"
  emptyText="No results found"
  [options]="taskService.sortedTasks()"
  [labelFn]="taskLabelFn"
  [getSearchStrings]="taskSearchStrings"
  (searchChange)="taskService.searchQuery.set($event)"
  (valueChange)="onTaskSelected($event)"
/>

<button
  appBtn
  preset="addTask"
  ariaLabel="Add new task"
  (click)="taskService.openAddTask()"
></button>
