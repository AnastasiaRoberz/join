<button
  appBtn
  preset="close"
  class="btn-close"
  (click)="dialogService.openDialog('task', task())"
></button>

<form [formGroup]="taskForm" (ngSumbit)="saveTask()" class="scroll-container">
  <app-text-field [id]="'title'" formControlName="title" labelPos="top" label="Title" />
  <app-text-field
    [id]="'description'"
    formControlName="description"
    labelPos="top"
    label="Description"
    type="textarea"
  />

  <button appBtn type="submit" preset="check">Ok</button>
</form>
