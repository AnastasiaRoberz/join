<form [formGroup]="taskForm" (ngSubmit)="saveTask()" cdkScrollable>
  <div class="form-content-wrapper scroll-container">
    <app-text-field id="title" formControlName="title" labelPos="top" label="Title" />

    <app-text-field
      fieldId="description"
      formControlName="description"
      labelPos="top"
      label="Description"
      type="textarea"
    />

    <app-calendar-field id="due-date" formControlName="dueDate" label="Due Date" />

    <app-priority-btn formControlName="priority" />

    <app-select-field
      #assignedSelect
      fieldId="assigned-to"
      label="Assigned to"
      placeholder="Select contacts to assign"
      emptyText="No contacts found."
      [options]="contactService.sortedContacts()"
      [multi]="true"
      [(value)]="selectedContactIds"
      [getSearchStrings]="contactService.contactSearchStrings"
    >
      <ng-template #optionTemplate let-contact let-selected="selected">
        <app-user-avatar [user]="contact" size="medium" />
        <span class="name">{{ contact.firstname }} {{ contact.surname }}</span>
        <app-checkbox [checked]="selected" />
      </ng-template>
      <app-avatar-group
        footer
        [users]="selectedContacts()"
        size="medium"
        [overlapLayout]="false"
        (userDeletedId)="assignedSelect.deselect($event)"
      />
    </app-select-field>

    <app-subtask-field [(subtasks)]="currentSubtasks" />
  </div>

  <button appBtn type="submit" preset="check">Ok</button>
</form>
