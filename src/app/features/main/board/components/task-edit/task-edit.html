<button
  appBtn
  preset="close"
  class="btn-close"
  (click)="dialogService.openDialog('task', task())"
></button>

<form [formGroup]="taskForm" (ngSubmit)="saveTask()" class="scroll-container" cdkScrollable>
  <app-text-field id="title" formControlName="title" labelPos="top" label="Title" />
  <app-text-field
    id="description"
    formControlName="description"
    labelPos="top"
    label="Description"
    type="textarea"
  />
  <app-calendar-field id="due-date" formControlName="dueDate" label="Due Date" />

  <app-select-field
    id="assigned-to"
    label="Assigned to"
    [options]="contactService.sortedContacts()"
    [selectedIds]="taskForm.controls.assignedTo.value ?? []"
    (selectedIdsChange)="onAssignedChange($event)"
  />

  <button appBtn type="submit" preset="check">Ok</button>
</form>
