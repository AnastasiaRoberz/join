<form [formGroup]="taskForm" (ngSubmit)="saveTask()" cdkScrollable aria-label="Edit task">
  <div class="form-content-wrapper" [class.scroll-container]="!isShortHeight()" cdkScrollable>
    <app-text-field
      fieldId="task-edit-title"
      formControlName="title"
      requiredMsg
      labelPos="top"
      label="Title"
      type="input"
      placeholder="Enter a title"
      showCharCount
      [maxLength]="200"
    />

    <app-text-field
      fieldId="task-edit-description"
      formControlName="description"
      labelPos="top"
      label="Description"
      type="textarea"
      placeholder="Enter a description"
    />

    <app-calendar-field
      fieldId="task-edit-date"
      formControlName="dueDate"
      label="Due date"
      requiredMsg
    />

    <app-priority-btn formControlName="priority" />

    <app-select-field
      #assignedSelect
      fieldId="assigned-to"
      label="Assigned to"
      placeholder="Select contacts to assign"
      emptyText="No contacts found."
      [options]="userService.assignableContacts()"
      [multi]="true"
      [(value)]="selectedContactIds"
      [getSearchStrings]="contactService.contactSearchStrings"
    >
      <ng-template #optionTemplate let-contact let-selected="selected">
        <app-user-avatar [user]="contact" size="medium" />
        <span class="name"
          >{{ contact.firstname }} {{ contact.surname }}
          @if (contact.id === userService.currentContact()?.id) {
            (You)
          }
        </span>
        <app-checkbox
          [checked]="selected"
          (checkedChange)="toggleAssignment(contact.id, $event)"
          class="whiteIcon"
        />
      </ng-template>
      <app-avatar-group
        footer
        [users]="selectedContacts()"
        [class.has-users]="selectedContacts().length > 0"
        size="medium"
        [overlapLayout]="false"
        (userDeletedId)="assignedSelect.deselect($event)"
      />
    </app-select-field>

    <app-subtask-field [(subtasks)]="currentSubtasks" />
  </div>

  <button
    class="btn-submit"
    appBtn
    type="submit"
    preset="check"
    aria-label="Save task changes"
    [disabled]="taskForm.invalid || isSubmitting()"
  >
    Ok
  </button>
</form>
