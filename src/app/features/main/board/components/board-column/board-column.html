<header class="header">
  <h3 class="header__title">{{ status() }}</h3>
  @if (status() !== 'Done') {
    
    <button
      appBtn
      preset="iconSmall"
      icon="add-task-btn"
      type="button"
      (click)="taskService.openAddTask(status())"
      [attr.aria-label]="'Add task to ' + status()"
    ></button>
  }
</header>

<div class="tasks scroll-container" #taskList role="list" [attr.aria-label]="status() + ' tasks'">
  @for (task of tasks(); track task.id) {
    
    <app-task-card
      [task]="task"
      cdkDrag
      [cdkDragBoundary]="responsiveService.isMobile() ? 'app-board' : 'app-board-container'"
      [cdkDragStartDelay]="{ touch: 250, mouse: 0 }"
      (cdkDragStarted)="onDragStarted($event)"
    />
  } @empty {
    @if (!showDropHint()) {
      <p class="tasks__empty" aria-live="polite">
        {{ taskService.searchQuery().trim() ? 'No results found' : 'No tasks ' + status() }}
      </p>
    }
  }
  
  @if (showDropHint()) {
    <div
      class="tasks__placeholder tasks__drop-hint"
      [style.width.px]="dropHintSize().width"
      [style.height.px]="dropHintSize().height"
      aria-hidden="true"
    ></div>
  }
</div>
