<section class="board-column">
  <header class="board-column__header">
    <h3 class="board-column__title">{{ status() }}</h3>
    @if (status() !== 'Done') {
      <!-- added method dialogService.openAddTask() in click (new in DialogService), also passing status-->
      <button
        appBtn
        preset="iconSmall"
        icon="add-task-btn"
        type="button"
        (click)="taskService.openAddTask(status())"
        [attr.aria-label]="'Add task to ' + status()"
      ></button>
    }
  </header>

  <div class="board-column__tasks scroll-container">
    @for (task of tasks(); track task.id) {
      <!-- cdkDrag = making the task cards drag and drop items, pointer down to start visualization-->
      <app-task-card
        [task]="task"
        cdkDrag
        cdkDragBoundary="app-board"
        (pointerdown)="onCardPressed($event)"
      />
    } @empty {
      <!-- hidden while the column shows the placeholder -->
      @if (!showDropHint()) {
        <p class="board-column__empty">No tasks {{ status() }}</p>
      }
    }
    <!-- show drop placeholder with size of actual card clicked inside the column -->
    @if (showDropHint()) {
      <div
        class="board-column__placeholder board-column__drop-hint"
        [style.width.px]="dropHintSize().width"
        [style.height.px]="dropHintSize().height"
      ></div>
    }
  </div>
</section>
