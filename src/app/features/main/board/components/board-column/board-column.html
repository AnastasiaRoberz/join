<section class="board-column">
  <header class="board-column__header">
    <h3 class="board-column__title">{{ status() }}</h3>
    @if (status() !== 'Done') {
      <button
        appBtn
        variant="icon"
        icon="plus-square"
        type="button"
        (click)="openAddTask()"
        [attr.aria-label]="'Add task to ' + status()"
      ></button>
    }
  </header>

  <div class="board-column__tasks">
    @for (task of tasks(); track task.id) {
      <app-task-card [task]="task" />
    } @empty {
      <p class="board-column__empty">No tasks {{ status() }}</p>
    }
  </div>
</section>
