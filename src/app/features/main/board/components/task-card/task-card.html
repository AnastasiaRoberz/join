<article
  class="task-card"
  (click)="dialogService.openDialog('task', task())"
  (keydown.enter)="dialogService.openDialog('task', task())"
  (keydown.space)="dialogService.openDialog('task', task())"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Open task: ' + task().title"
>
  <div class="task-card__header">
    <span class="task-card__category" [style.background-color]="categoryColor()">
      {{ task().category }}
    </span>

    <div class="task-card__mobile-move" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="task-card__move-btn"
        aria-label="Move task to another column"
        [attr.aria-expanded]="statusMenuOpen()"
        (click)="toggleStatusMenu($event)"
      >
        <svg class="icon-move">
          <use href="./assets/icons/icons.svg#arrow-down"></use>
        </svg>
      </button>

      @if (statusMenuOpen()) {
        <div class="task-card__move-menu" role="menu">
          <span class="task-card__move-menu-title">Move to:</span>
          @for (targetStatus of targetStatuses(); track targetStatus) {
            <button
              type="button"
              class="task-card__move-item"
              role="menuitem"
              (click)="moveToStatus(targetStatus, $event)"
            >
              {{ targetStatus }}
            </button>
          }
        </div>
      }
    </div>
  </div>

  <div class="task-card__text">
    <h4 class="task-card__title">{{ task().title }}</h4>

    @if (task().description) {
      <p class="task-card__description">{{ task().description }}</p>
    }
  </div>

  @if (totalSubtasks() > 0) {
    <div class="task-card__progress">
      
      <progress
        class="task-card__bar"
        aria-label="Subtask progress"
        [value]="doneSubtasks()"
        [max]="totalSubtasks()"
        [appCursorTooltip]="doneSubtasks() + ' of ' + totalSubtasks() + ' subtasks completed'"
      ></progress>
      <span class="task-card__count">{{ doneSubtasks() }}/{{ totalSubtasks() }} Subtasks</span>
    </div>
  }

  <footer class="task-card__footer">
    <app-avatar-group
      class="task-card__users"
      role="group"
      aria-label="Assigned users"
      [users]="task().assigned_users ?? []"
      size="small"
    />
    <svg
      class="task-card__priority"
      role="img"
      [attr.aria-label]="'Priority: ' + task().priority"
      [class]="'icon-priority icon-' + task().priority"
    >
      <use [attr.href]="'./assets/icons/icons.svg#' + task().priority"></use>
    </svg>
  </footer>
</article>
