
@for (column of columns(); track column.status) {
  <app-board-column
    cdkDropList
    [cdkDropListAutoScrollStep]="10"
    [cdkDropListOrientation]="responsiveService.horizontalDrag() ? 'horizontal' : 'vertical'"
    cdkDropListElementContainer=".scroll-container"
    [cdkDropListData]="column.tasks"
    (cdkDropListDropped)="dragDrop($event, column.status)"
    [showDropHint]="isNeighbourColumn($index)"
    [dropHintSize]="pressedCardSize()"
    (cardPressed)="pressedColumnIndex.set($index); pressedCardSize.set($event)"
    [status]="column.status"
    [tasks]="column.tasks"
    [attr.aria-label]="column.status + ' column'"
  />
}
