<section class="summary">
  <header class="summary__header">
    <h2>Join 360</h2>
    <hr />
    <p class="subheading summary__header__slogan">Key Metrics at a Glance</p>
  </header>
  <div class="summary__content">
    <div class="summary__content__tiles">
      <a href="" class="half">
        <svg class="icon">
          <use [attr.href]="'./assets/icons/icons.svg#dashboard-todo'"></use>
        </svg>
        <div class="details">
          <span class="amount">1</span>
          <p class="type">To-do</p>
        </div>
      </a>
      <a href="" class="half">
        <svg class="icon">
          <use [attr.href]="'./assets/icons/icons.svg#dashboard-done'"></use>
        </svg>
        <div class="details">
          <span class="amount">2</span>
          <p class="type">Done</p>
        </div>
      </a>
      <a href="" class="full deadline">
        <div class="details">
          <svg class="deadline-icon">
            <use [attr.href]="'./assets/icons/icons.svg#dashboard-urgent'"></use>
          </svg>
          <span class="amount">1</span>
        </div>
        <div class="details">
          <svg class="deadline-icon">
            <use [attr.href]="'./assets/icons/icons.svg#dashboard-medium'"></use>
          </svg>
          <span class="amount">2</span>
        </div>
        <div class="details">
          <svg class="deadline-icon">
            <use [attr.href]="'./assets/icons/icons.svg#dashboard-low'"></use>
          </svg>
          <span class="amount">3</span>
        </div>
        <hr />
        <div class="deadline__info">
          <span class="date">October 16, 2022</span>
          <span class="headsup">Upcoming Deadline</span>
        </div>
      </a>
      <a href="" class="third">
        <div class="details">
          <span class="amount">3</span>
          <p class="type">Tasks in Board</p>
        </div>
      </a>
      <a href="" class="third">
        <div class="details">
          <span class="amount">4</span>
          <p class="type">Tasks in Progress</p>
        </div>
      </a>
      <a href="" class="third">
        <div class="details">
          <span class="amount">5</span>
          <p class="type">Awaiting Feedback</p>
        </div>
      </a>
    </div>
    @if (!responsiveService.isMobile()) {
      <div class="welcome">
        <p class="welcome__greeting">Good moring,</p>
        <p class="welcome__name">Sofia Müller</p>
      </div>
    }
  </div>
</section>
