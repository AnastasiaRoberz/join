<section class="summary">
  @if (introService.isActive()) {
    <div class="greeter-overlay"></div>
  }
  <!-- header -->
  <header class="summary__header">
    <h2>Join 360</h2>
    <hr />
    <p class="subheading summary__header__slogan">Key Metrics at a Glance</p>
  </header>

  <div class="summary__content">
    <div class="summary__content__tiles">
      <!-- Todo and Done -->
      <a href="" class="half">
        <span class="icon">
          <svg>
            <use [attr.href]="'./assets/icons/icons.svg#edit'"></use>
          </svg>
        </span>
        <div class="details">
          <span class="amount">1</span>
          <p class="type">To-do</p>
        </div>
      </a>
      <a href="" class="half">
        <span class="icon icon-bold">
          <svg>
            <use [attr.href]="'./assets/icons/icons.svg#check'"></use>
          </svg>
        </span>
        <div class="details">
          <span class="amount">2</span>
          <p class="type">Done</p>
        </div>
      </a>
      <!-- priority and deadline -->
      <a href="" class="full deadline">
        <div class="details">
          <span class="deadline-icon deadline-icon--urgent">
            <svg>
              <use [attr.href]="'./assets/icons/icons.svg#urgent'"></use>
            </svg>
          </span>
          <span class="amount">1</span>
        </div>
        <div class="details">
          <span class="deadline-icon deadline-icon--medium">
            <svg>
              <use [attr.href]="'./assets/icons/icons.svg#medium'"></use>
            </svg>
          </span>
          <span class="amount">2</span>
        </div>
        <div class="details">
          <span class="deadline-icon deadline-icon--low">
            <svg>
              <use [attr.href]="'./assets/icons/icons.svg#low'"></use>
            </svg>
          </span>
          <span class="amount">3</span>
        </div>
        <hr />
        <div class="deadline__info">
          <span class="date">October 16, 2022</span>
          <span class="headsup">Upcoming Deadline</span>
        </div>
      </a>
      <!-- board, progress and feedback -->
      <a href="" class="third">
        <div class="details">
          <span class="amount">3</span>
          <p class="type">Tasks in Board</p>
        </div>
      </a>
      <a href="" class="third">
        <div class="details">
          <span class="amount">4</span>
          <p class="type">Tasks in Progress</p>
        </div>
      </a>
      <a href="" class="third">
        <div class="details">
          <span class="amount">5</span>
          <p class="type">Awaiting Feedback</p>
        </div>
      </a>
    </div>
    <!-- greeting -->

    <div class="welcome" [class.greeter-active]="introService.isActive()">
      @if (!isShortHeight()) {
        <p class="welcome__greeting">Good morning,&nbsp;</p>
        <p class="welcome__name">Sofia Müller</p>
      }
    </div>
  </div>
</section>
