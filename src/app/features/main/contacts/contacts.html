
@if (!(responsiveService.isMobile() && selectedId())) {
  <app-contact-list [selectedId]="selectedId()" (contactSelected)="selectContact($event)" />
}

@if (!responsiveService.isMobile() || selectedId()) {
  <div
    class="details"
    [class.scroll-container]="shortHeight()"
    role="region"
    aria-label="Contact details"
  >
    <div class="details__title__container">
      <div class="details__title">
        <h2>Contacts</h2>
        <hr aria-hidden="true" />
        <p class="subheading">Better with a team</p>
      </div>
      
      @if (responsiveService.isMobile()) {
        <button
          appBtn
          preset="iconMedium"
          icon="arrow-back"
          ariaLabel="Back to contact list"
          (click)="closeDetails()"
        ></button>
      }
    </div>
    @if (selectedId(); as id) {
      <app-contact-details [selectedId]="id" (contactDeleted)="onContactDeleted()" />
    }
  </div>
}
