<!-- class "&--detail-open" is added when an id is present-->
<!-- container’s current selectedId value is handed to the list’s selectedId input.
     contactSelected calls selectContact(). $event is the value  -->
@if (!(responsiveService.isMobile() && selectedId())) {
  <app-contact-list [selectedId]="selectedId()" (contactSelected)="selectContact($event)" />
}

@if (!responsiveService.isMobile() || selectedId()) {
  <div class="details">
    <div class="details__title__container">
      <div class="details__title">
        <h2>Contacts</h2>
        <hr />
        <p class="subheading">Better with a team</p>
      </div>
      <!-- Back arrow: only visible on mobile (contacts.scss) -->
      @if (responsiveService.isMobile()) {
        <button class="btn btn-icon" type="button" (click)="closeDetails()">
          <svg class="icon">
            <use href="./assets/icons/icons.svg#arrow"></use>
          </svg>
        </button>
      }
    </div>
    @if (selectedId(); as id) {
      <app-contact-details [selectedId]="id" (contactDeleted)="closeDetails()" />
    }
  </div>
}
