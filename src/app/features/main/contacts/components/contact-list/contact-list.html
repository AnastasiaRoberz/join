<button appBtn preset="addContact" (click)="dialogService.openDialog('contact')"></button>

<div class="contact-list scroll-container">
  @for (group of contactService.groupedContacts(); track $index) {
    <p class="group-letter">{{ group.letter }}</p>
    <hr />
    <div class="group-wrapper">
      @for (contact of group.contacts; track $index) {
        <!-- Angular adds the class "contact--active" ONLY when this contact's id equals the selected id from the container. -->
        <!-- (click) sends id to contacts.ts -->
        <button
          #contactBtn
          class="contact-card-btn"
          type="button"
          [class.contact--active]="contact.id === selectedId()"
          (click)="contactSelected.emit(contact.id)"
        >
          <app-user-avatar [user]="contact" size="medium"></app-user-avatar>
          <div class="details">
            <p class="name">{{ fullName(contact) }}</p>
            <p class="mail">{{ contact.mail }}</p>
          </div>
        </button>
      }
    </div>
  }
</div>
