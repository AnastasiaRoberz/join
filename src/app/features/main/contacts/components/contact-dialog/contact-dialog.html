<div class="header-section">
  @if (responsiveService.isMobile()) {
    <button
      appBtn
      preset="iconSmall"
      icon="x"
      class="btn-close-mobile"
      (click)="closeDialog()"
    ></button>
  }
  <div class="header">
    @if (contact()) {
      <h2>Edit contact</h2>
    } @else {
      <h2>Add contact</h2>
      <span class="subheading">Tasks are better with a team!</span>
    }
  </div>
</div>

<div class="content-section">
  @if (!responsiveService.isMobile()) {
    <button appBtn preset="iconSmall" icon="x" (click)="closeDialog()"></button>
  }

  <div class="input-wrapper">
    <app-user-avatar class="avatar" [user]="contact()" size="large" />

    <form class="form-section" [formGroup]="contactForm" (ngSubmit)="saveContact()">
      <app-text-field label="Name" formControlName="name" icon="person" [id]="'name'" />

      <app-text-field label="Mail" formControlName="mail" icon="mail" [id]="'mail'" />

      <app-text-field label="Phone" formControlName="phone" icon="phone" [id]="'phone'" />

      <div class="buttons-wrapper">
        @if (contact()) {
          <button appBtn preset="secondary" (click)="deleteAndClose()">Delete</button>
          <button
            appBtn
            preset="check"
            type="submit"
            [disabled]="!contactForm.valid || isSubmitting()"
          >
            Save
          </button>
        } @else {
          @if (!responsiveService.isMobile()) {
            <button appBtn preset="cancel" icon="x" (click)="closeDialog()">Cancel</button>
          }

          <button
            appBtn
            preset="check"
            type="submit"
            [disabled]="!contactForm.valid || isSubmitting()"
          >
            Create contact
          </button>
        }
      </div>
    </form>
  </div>
</div>
