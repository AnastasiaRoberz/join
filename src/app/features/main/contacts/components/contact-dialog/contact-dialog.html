<div class="header-section">
  <div class="header-section__header">
    @if (contact()) {
      <h2>Edit contact</h2>
    } @else {
      <h2>Add contact</h2>
      <span class="header-section__subheading">Tasks are better with a team!</span>
    }
  </div>
</div>

<div class="content-section">
  <div class="content-section__input-wrapper">
    <app-user-avatar [user]="contact()" size="large" />

    <form
      class="content-section__form-section"
      [formGroup]="contactForm"
      (ngSubmit)="saveContact()"
    >
      <app-text-field label="Name" formControlName="name" icon="person" fieldId="name" />

      <app-text-field label="Mail" formControlName="mail" icon="mail" fieldId="mail" />

      <app-text-field label="Phone" formControlName="phone" icon="phone" fieldId="phone" />

      <div class="content-section__buttons-wrapper">
        @if (contact()) {
          <button appBtn preset="secondary" (click)="deleteAndClose()">Delete</button>
          <button
            appBtn
            preset="check"
            type="submit"
            [disabled]="!contactForm.valid || isSubmitting()"
          >
            Save
          </button>
        } @else {
          @if (!responsiveService.isMobile()) {
            <button appBtn preset="cancel" icon="x" (click)="closeDialog()">Cancel</button>
          }

          <button
            appBtn
            preset="check"
            type="submit"
            [disabled]="!contactForm.valid || isSubmitting()"
          >
            Create contact
          </button>
        }
      </div>
    </form>
  </div>
</div>
