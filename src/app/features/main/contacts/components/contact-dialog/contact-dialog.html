<div class="dialog-content" (click)="$event.stopPropagation()">
  <div class="header-section">
    <div class="header">
      @if (contact()) {
        <h2>Edit contact</h2>
      } @else {
        <h2>Add contact</h2>
        <p class="subheading">Tasks are better with a team!</p>
      }
    </div>
  </div>
  <div class="content-section">
    <button appBtn preset="close" (click)="closeDialog()"></button>

    <div class="input-wrapper">
      <app-user-avatar class="avatar" [user]="contact()" size="large"></app-user-avatar>

      <form class="form-section" [formGroup]="contactForm">
        <app-input-field label="Name" icon="person">
          <input type="text" formControlName="name" placeholder=" " />
        </app-input-field>

        <app-input-field label="Mail" icon="mail">
          <input type="text" formControlName="mail" placeholder=" " />
        </app-input-field>

        <app-input-field label="Phone" icon="phone">
          <input type="text" formControlName="phone" placeholder="" />
        </app-input-field>

        <div class="buttons-wrapper">
          @if (contact()) {
            <button appBtn preset="secondary">Delete</button>
            <button appBtn preset="check">Save</button>
          } @else {
            <button appBtn preset="x" (click)="closeDialog()">Cancel</button>
            <button appBtn preset="check">Create contact</button>
          }
        </div>
      </form>
    </div>
  </div>
</div>
