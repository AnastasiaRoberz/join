@if (selectedContact(); as contact) {
  <div class="detail-header" [class.detail-header__long]="isLongName()">
    <app-user-avatar [user]="contact" size="details"></app-user-avatar>
    <div class="name-wrapper">
      <p class="name">{{ contact.firstname }} {{ contact.surname }}</p>
    </div>
  </div>

  @if (!responsiveService.isTablet() || menuOpen()) {
    <div class="btn-wrapper" [class.is-tablet]="responsiveService.isTablet()">
      <button appBtn preset="editIcon" (click)="dialogService.openDialog(contact)"></button>
      <button appBtn preset="deleteIcon" (click)="deleteContact(contact.id)"></button>
    </div>
  }

  <p class="info-heading">Contact Information</p>

  <div class="detail-info">
    <strong>Email</strong>
    <p class="mail">{{ contact.mail }}</p>
  </div>

  <div class="detail-info">
    <strong>Phone</strong>
    <p>{{ contact.phone }}</p>
  </div>

  @if (responsiveService.isTablet()) {
    <button type="button" class="btn-dots" (click)="toggleMenu($event)">
      <svg class="icon">
        <use href="./assets/icons/icons.svg#dots-menu"></use>
      </svg>
    </button>
  }
}
