@if (selectedContact(); as contact) {
  <div class="detail-header">
    <app-user-avatar [user]="contact" size="large"></app-user-avatar>
    <div class="name-wrapper">
      <p class="name" appFitText container="parent" [minSize]="24" [maxSize]="47">
        {{ fullName(contact) }}
      </p>
      <div
        class="btn-wrapper"
        [class.is-tablet]="responsiveService.isTablet()"
        [class.is-open]="menuOpen()"
      >
        <button
          appBtn
          preset="edit"
          (click)="dialogService.openDialog('contact', contact)"
        ></button>
        <button appBtn preset="delete" (click)="deleteContact(contact.id)"></button>
      </div>
    </div>
  </div>

  <p class="info-heading">Contact Information</p>

  <div class="detail-info">
    <strong>Email</strong>
    <p class="mail">{{ contact.mail }}</p>
  </div>

  <div class="detail-info">
    <strong>Phone</strong>
    <p>{{ contact.phone }}</p>
  </div>

  @if (responsiveService.isTablet()) {
    <button
      appBtn
      preset="iconMedium"
      icon="dots-menu"
      class="btn-dots"
      (click)="toggleMenu($event)"
    ></button>
  }
}
