@if (selectedContact(); as contact) {
  <div class="detail-header" [class.detail-header__long]="isLongName()">
    <app-user-avatar [user]="contact" size="large"></app-user-avatar>
    <div class="name-wrapper">
      <p class="name">{{ contact.firstname }} {{ contact.surname }}</p>
      <!-- btn-wrapper--open is set while the mobile menu is open -->
      <div class="btn-wrapper" [class.btn-wrapper--open]="menuOpen()">
        <!-- Desktop: shown inline next to each other. Mobile: the popup menu -->
        <div class="menu">
          <button class="btn btn-txtIcon" (click)="dialogService.openDialog(contact)">
            <svg class="btn-icon">
              <use href="./assets/icons/icons.svg#edit"></use>
            </svg>
            <span class="btn-label" data-text="Edit">Edit</span>
          </button>
          <button
            class="btn btn-txtIcon"
            data-text="Delete"
            (click)="deleteContact(contact.id)"
          >
            <svg class="btn-icon">
              <use href="./assets/icons/icons.svg#delete"></use>
            </svg>
            <span class="btn-label" data-text="Delete">Delete</span>
          </button>
        </div>

        <!-- Mobile only: opens the menu -->
        <button type="button" class="btn-dots" (click)="toggleMenu($event)">
          <svg class="dots">
            <use href="./assets/icons/icons.svg#dots"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <p class="info-heading">Contact Information</p>
  <div class="detail-info">
    <strong>E-Mail</strong>
    <p class="mail" [title]="contact.mail">{{ contact.mail }}</p>
  </div>
  <div class="detail-info">
    <strong>Phone</strong>
    <p>{{ contact.phone }}</p>
  </div>
}
