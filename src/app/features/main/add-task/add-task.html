<h2 class="task-header" id="add-task-heading">Add Task</h2>

<form
  [formGroup]="taskForm"
  (ngSubmit)="onSubmit()"
  aria-labelledby="add-task-heading"
  [class.scroll-container]="isMiddleHeight()"
  cdkScrollable
>
  <div
    class="task-container"
    [class.scroll-container]="
      (isMobileOrLandscape() && !isShortHeight() && !isMiddleHeight()) || isTabletSpecialHeight()
    "
    cdkScrollable
  >
    <div class="task-wrap task-left">
      <app-text-field
        fieldId="task-title"
        class="task-input"
        formControlName="title"
        requiredMsg
        labelPos="top"
        label="Title"
        type="input"
        placeholder="Enter a title"
        showCharCount
        [maxLength]="200"
      ></app-text-field>

      <app-text-field
        fieldId="task-description"
        class="task-input"
        formControlName="description"
        labelPos="top"
        label="Description"
        type="textarea"
        placeholder="Enter a description"
      ></app-text-field>

      <app-calendar-field
        fieldId="task-date"
        label="Due date"
        formControlName="date"
        requiredMsg
      ></app-calendar-field>
    </div>

    @if (!responsiveService.isMobile()) {
      <div class="divider" aria-hidden="true"></div>
    }

    <div class="task-wrap task-right">
      <app-priority-btn
        formControlName="priority"
        [(activePriority)]="selectedPrio"
      ></app-priority-btn>

      <app-select-field
        label="Assigned to"
        placeholder="Select contacts to assign"
        emptyText="No contacts found."
        [options]="userService.assignableContacts()"
        [multi]="true"
        [(value)]="selectedContactIds"
        [getSearchStrings]="contactSearchStrings"
      >
        <ng-template #optionTemplate let-contact let-selected="selected">
          <app-user-avatar [user]="contact" size="medium"></app-user-avatar>
          <span class="name">
            {{ contact.firstname }} {{ contact.surname }}
            @if (contact.id === userService.currentContact()?.id) {
              (You)
            }
          </span>
          <app-checkbox
            [checked]="selected"
            (checkedChange)="toggleAssignment(contact.id, $event)"
            class="whiteIcon"
          ></app-checkbox>
        </ng-template>
        <app-avatar-group
          footer
          [users]="selectedContacts()"
          [class.has-users]="selectedContacts().length > 0"
          size="medium"
          [overlapLayout]="false"
          (userDeletedId)="toggleAssignment($event, false)"
        />
      </app-select-field>

      <app-select-field
        label="Category"
        placeholder="Select task category"
        formControlName="category"
        requiredMsg
        [options]="categories"
        [valueKey]="categoryKey"
        [required]="true"
        [scrollable]="false"
      ></app-select-field>

      <app-subtask-field
        [(subtasks)]="createdSubtasks"
        [isScrollable]="!isMobileOrLandscape() && !isTabletSpecialHeight()"
        class="task-input"
      ></app-subtask-field>
    </div>
  </div>

  <div class="task-footer">
    <span> <span aria-hidden="true" class="required">*</span>This field is required </span>
    <div class="task-footer__buttons">
      <button appBtn preset="cancel" label="Clear" (click)="onClear()" [disabled]="isSubmitting()"></button>
      <button
        appBtn
        preset="check"
        type="submit"
        label="Create Task"
        [disabled]="taskForm.invalid || isSubmitting()"
        [attr.aria-disabled]="taskForm.invalid || isSubmitting()"
      ></button>
    </div>
  </div>
</form>
