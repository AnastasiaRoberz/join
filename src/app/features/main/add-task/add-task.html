<div class="content">
  <h2>Add Task</h2>
  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
    <div class="task-container">
      <div class="taskWrap taskLeft">
        <app-text-field
          id="task-title"
          formControlName="title"
          labelPos="top"
          label="Title"
          type="input"
          placeholder="Enter a Title"
        ></app-text-field>

        <app-text-field
          id="task-description"
          formControlName="description"
          labelPos="top"
          label="Description"
          type="textarea"
          placeholder="Enter a Description"
        ></app-text-field>

        <app-calendar-field
          id="task-date"
          label="Due date"
          formControlName="date"
        ></app-calendar-field>
      </div>

      <div class="taskWrap">
        <app-priority-btn></app-priority-btn>

        <app-select-field
          label="Assigned to"
          placeholder="Select Contacts to assign"
          emptyText="No contacts found."
          [options]="contactService.sortedContacts()"
          [multi]="true"
          [(value)]="selectedContactIds"
          [getSearchStrings]="contactSearchStrings"
        >
          <ng-template #optionTemplate let-contact let-selected="selected">
            <app-user-avatar [user]="contact" size="medium"></app-user-avatar>
            <span class="name">{{ contact.firstname }} {{ contact.surname }}</span>
            <app-checkbox
              [checked]="selected"
              (checkedChange)="toggleAssignment(contact.id, $event)"
            ></app-checkbox>
          </ng-template>
          <app-avatar-group
            footer
            [users]="selectedContacts()"
            size="medium"
            [overlapLayout]="false"
            (userDeletedId)="toggleAssignment($event, false)"
          />
        </app-select-field>

        <app-select-field
          label="Category"
          placeholder="Select Task Category"
          [options]="categories"
          [(value)]="selectedCategory"
          (valueChange)="onCategoryChange($event)"
        ></app-select-field>

        <app-subtask-field></app-subtask-field>
      </div>
    </div>

    <div class="task-footer">
      <span><span class="required">*</span>This field is required</span>
      <div class="task-footer__buttons">
        <button
          appBtn
          preset="secondary"
          label="Clear"
          icon="cancel"
          type="button"
          (click)="onClear()"
        ></button>
        <button
          appBtn
          preset="primary"
          label="Create Task"
          icon="check"
          type="submit"
          [disabled]="taskForm.invalid"
        ></button>
      </div>
    </div>
  </form>
</div>
