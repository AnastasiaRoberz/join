<h2>Log in</h2>

<form [formGroup]="loginForm" (ngSubmit)="onLogin()">
  <app-text-field label="Email" icon="mail" fieldId="mail" formControlName="mail" />
  <app-text-field
    inputType="password"
    label="Password"
    fieldId="password"
    formControlName="password"
  />
  <div class="button-wrapper">
    <button appBtn preset="primary" size="medium" type="submit" [disabled]="!loginForm.valid">
      Log in
    </button>
    <button appBtn preset="secondary" size="medium" (click)="userService.logIn()">
      Guest Log in
    </button>
  </div>
</form>
