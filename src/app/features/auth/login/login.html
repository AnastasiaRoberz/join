<h2 id="login-heading">Log in</h2>

<form [formGroup]="loginForm" (ngSubmit)="onLogin()" aria-labelledby="login-heading">
  <app-text-field
    label="Email"
    icon="mail"
    fieldId="mail"
    formControlName="mail"
    autocomplete="email"
  />
  <app-text-field
    inputType="password"
    label="Password"
    fieldId="password"
    formControlName="password"
    autocomplete="current-password"
  />
  <div class="button-wrapper">
    <button
      appBtn
      preset="primary"
      size="medium"
      type="submit"
      [disabled]="!loginForm.valid"
      [attr.aria-disabled]="!loginForm.valid"
    >
      Log in
    </button>
    <button appBtn preset="secondary" size="medium" (click)="anonymLogin()" type="button">
      Guest Log in
    </button>
  </div>
</form>
