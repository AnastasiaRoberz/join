<header>
  <a
    appBtn
    preset="iconMedium"
    icon="arrow-back"
    routerLink="../login"
    aria-label="Back to log in"
  ></a>
  <h2 id="signup-heading">Sign up</h2>
</header>

<form [formGroup]="registerForm" aria-labelledby="signup-heading">
  <app-text-field fieldId="name" label="Name" icon="person" formControlName="name" />
  <app-text-field label="Email" icon="mail" formControlName="mail" />
  <app-text-field label="Password" inputType="password" formControlName="password" />
  <app-text-field label="Confirm Password" inputType="password" formControlName="confirmPassword" />

  <div class="privacy-row">
    <app-checkbox fieldId="privacy" formControlName="privacy" />
    <label for="privacy">
      I accept the
      <a routerLink="/privacy-policy">Privacy policy</a>
    </label>
  </div>

  <button appBtn preset="primary" size="medium" type="submit" [disabled]="!registerForm.valid">
    Sign up
  </button>
</form>
