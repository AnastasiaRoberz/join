<header>
  <a appBtn preset="iconMedium" icon="arrow-back" routerLink="../login" aria-label="Back to log in"></a>
  <h2 id="signup-heading">Sign up</h2>
</header>

<form [formGroup]="registerForm" (ngSubmit)="onSignup()" aria-labelledby="signup-heading">
  <app-text-field fieldId="name" label="Name" icon="person" formControlName="name" />
  <app-text-field fieldId="mail" label="Email" icon="mail" formControlName="mail" />
  <app-text-field
    fieldId="password"
    inputType="password"
    label="Password"
    icon="lock"
    formControlName="password"
  />
  <app-text-field
    fieldId="confirmPassword"
    inputType="password"
    label="Confirm Password"
    icon="lock"
    formControlName="confirmPassword"
  />

  <div class="privacy-row">
    <app-checkbox fieldId="privacy" />
    <label for="privacy">
      I accept the
      <a routerLink="/privacy-policy" target="_blank" rel="noopener">Privacy policy</a>
    </label>
  </div>

  <button appBtn preset="primary" size="medium" type="submit">Sign up</button>
</form>
