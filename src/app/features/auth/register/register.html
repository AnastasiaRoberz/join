<form [formGroup]="registerForm" (ngSubmit)="onSignup()">
  <app-text-field fieldId="name" label="Name" icon="person" formControlName="name" />
  <app-text-field label="Email" icon="mail" formControlName="mail" />
  <app-text-field label="Password" icon="lock" formControlName="password" />
  <app-text-field label="Confirm Password" icon="lock" formControlName="confirmPassword" />
  <button appBtn preset="primary" type="submit">Sign up</button>
</form>
