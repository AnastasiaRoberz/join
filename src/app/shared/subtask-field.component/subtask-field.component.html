<label for="subtasks" [class.is-mobile]="responsiveService.isMobile()">Subtasks</label>

<div class="input-container">
  <input
    #mainInput
    type="text"
    id="subtasks"
    autocomplete="off"
    (keydown.enter)="$event.preventDefault(); saveSubtask(mainInput)"
    (keydown.escape)="clearInput(mainInput)"
  />
  <div class="input-btn-wrapper">
    <button type="button" class="btn-cancel" (click)="clearInput(mainInput)">
      <svg>
        <use href="./assets/icons/icons.svg#x"></use>
      </svg>
    </button>
    <hr />
    <button type="button" class="btn-save" (click)="saveSubtask(mainInput)">
      <svg>
        <use href="./assets/icons/icons.svg#check"></use>
      </svg>
    </button>
  </div>
</div>

<ul>
  @for (subtask of sortedSubtasks(); track subtask.id) {
    <li>
      @if (editingSubtaskId() !== subtask.id) {
        <div class="li-wrapper" (dblclick)="editSubtask(subtask.id)">
          <span>{{ subtask.title }}</span>
          <div class="subtask-btn-wrapper">
            <button type="button" class="btn-subtask" (click)="editSubtask(subtask.id)">
              <svg>
                <use href="./assets/icons/icons.svg#edit"></use>
              </svg>
            </button>
            <hr />
            <button type="button" class="btn-subtask" (click)="deleteSubtask(subtask.id)">
              <svg>
                <use href="./assets/icons/icons.svg#delete"></use>
              </svg>
            </button>
          </div>
        </div>
      } @else {
        <div class="li-wrapper">
          <input
            #editInput
            type="text"
            [value]="subtask.title"
            autocomplete="off"
            (keydown.enter)="$event.preventDefault(); updateSubtask(editInput, subtask.id)"
            (keydown.escape)="editingSubtaskId.set(null)"
          />
          <div class="subtask-btn-wrapper">
            <button type="button" class="btn-subtask" (click)="deleteSubtask(subtask.id)">
              <svg>
                <use href="./assets/icons/icons.svg#delete"></use>
              </svg>
            </button>
            <hr />
            <button
              type="button"
              class="btn-subtask"
              (click)="updateSubtask(editInput, subtask.id)"
            >
              <svg>
                <use href="./assets/icons/icons.svg#check"></use>
              </svg>
            </button>
          </div>
        </div>
      }
    </li>
  }
</ul>
