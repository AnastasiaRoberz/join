<label [for]="fieldId()">Subtasks</label>

<div class="input-container" (click)="mainInput.focus()">
  <input
    #mainInput
    type="text"
    [id]="fieldId()"
    autocomplete="off"
    (keydown.enter)="$event.preventDefault(); saveSubtask(mainInput)"
    (keydown.escape)="reset()"
  />
  <div class="input-btn-wrapper">
    <button
      appBtn
      preset="iconSmall"
      icon="x"
      ariaLabel="Clear subtask input"
      (click)="reset()"
    ></button>
    <hr aria-hidden="true" />
    <button
      appBtn
      preset="iconSmall"
      icon="check"
      ariaLabel="Save subtask"
      (click)="saveSubtask(mainInput)"
    ></button>
  </div>
</div>

<ul #subtaskList [class.scroll-container]="isScrollable()">
  @for (subtask of sortedSubtasks(); track subtask.id) {
    <li>
      @if (editingSubtaskId() !== subtask.id) {
        <div class="li-wrapper" (dblclick)="editSubtask(subtask.id)" role="listitem">
          <span>{{ subtask.title }}</span>
          <div class="subtask-btn-wrapper">
            <button
              appBtn
              preset="iconSmall"
              icon="edit"
              [ariaLabel]="'Edit subtask: ' + subtask.title"
              (click)="editSubtask(subtask.id)"
            ></button>
            <hr aria-hidden="true" />
            <button
              appBtn
              preset="iconSmall"
              icon="delete"
              [ariaLabel]="'Delete subtask: ' + subtask.title"
              (click)="deleteSubtask(subtask.id)"
            ></button>
          </div>
        </div>
      } @else {
        <div class="li-wrapper">
          <input
            #editInput
            type="text"
            id="editInput"
            [value]="subtask.title"
            autocomplete="off"
            (keydown.enter)="$event.preventDefault(); updateSubtaskTitle(editInput, subtask.id)"
            (keydown.escape)="editingSubtaskId.set(null)"
          />
          <div class="subtask-btn-wrapper">
            <button
              appBtn
              preset="iconSmall"
              icon="delete"
              [ariaLabel]="'Delete subtask: ' + subtask.title"
              (click)="deleteSubtask(subtask.id)"
            ></button>
            <hr aria-hidden="true" />
            <button
              appBtn
              preset="iconSmall"
              icon="check"
              [ariaLabel]="'Save subtask: ' + subtask.title"
              (click)="updateSubtaskTitle(editInput, subtask.id)"
            ></button>
          </div>
        </div>
      }
    </li>
  }
</ul>
