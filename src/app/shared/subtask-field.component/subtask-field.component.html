<label for="subtasks" [class.is-mobile]="responsiveService.isMobile()">Subtasks</label>

<div class="input-container">
  <input
    #mainInput
    type="text"
    id="subtasks"
    autocomplete="off"
    (keydown.enter)="$event.preventDefault(); saveSubtask(mainInput)"
    (keydown.escape)="clearInput(mainInput)"
  />
  <div class="input-btn-wrapper">
    <button appBtn preset="iconSmall" icon="cancel" (click)="clearInput(mainInput)"></button>
    <hr />
    <button
      appBtn
      preset="iconSmall"
      icon="check"
      class="btn-save"
      (click)="saveSubtask(mainInput)"
    ></button>
  </div>
</div>

<ul>
  @for (subtask of sortedSubtasks(); track subtask.id) {
    <li>
      @if (editingSubtaskId() !== subtask.id) {
        <div class="li-wrapper" (dblclick)="editSubtask(subtask.id)">
          <span>{{ subtask.title }}</span>
          <div class="subtask-btn-wrapper">
            <button
              appBtn
              preset="iconSmall"
              icon="edit"
              (click)="editSubtask(subtask.id)"
            ></button>
            <hr />
            <button
              appBtn
              preset="iconSmall"
              icon="delete"
              (click)="deleteSubtask(subtask.id)"
            ></button>
          </div>
        </div>
      } @else {
        <div class="li-wrapper">
          <input
            #editInput
            type="text"
            [value]="subtask.title"
            autocomplete="off"
            (keydown.enter)="$event.preventDefault(); updateSubtask(editInput, subtask.id)"
            (keydown.escape)="editingSubtaskId.set(null)"
          />
          <div class="subtask-btn-wrapper">
            <button
              appBtn
              preset="iconSmall"
              icon="delete"
              (click)="deleteSubtask(subtask.id)"
            ></button>
            <hr />
            <button
              appBtn
              preset="iconSmall"
              icon="check"
              (click)="updateSubtask(editInput, subtask.id)"
            ></button>
          </div>
        </div>
      }
    </li>
  }
</ul>
