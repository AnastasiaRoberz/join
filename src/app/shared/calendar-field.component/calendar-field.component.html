@if (label()) {
  <label [attr.for]="id()" [class.is-mobile]="responsiveService.isMobile()"
    >{{ label() }}
    @if (isRequired()) {
      <span class="required">*</span>
    }
  </label>
}

<div class="input-container">
  <input
    type="text"
    [id]="id()"
    [value]="value()"
    (blur)="onTouched()"
    #picker="appFlatpickr"
    appFlatpickr
    (dateChanged)="onDateSelect($event)"
    placeholder="dd/mm/yyyy"
    autocomplete="off"
  />
  <button appBtn preset="iconSmall" icon="calendar" (click)="picker.toggle()"></button>

  <span class="error-msg">{{ showError() }}</span>
</div>
