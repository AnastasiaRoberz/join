@if (label()) {
  <label [attr.for]="fieldId()" [class.is-mobile]="responsiveService.isMobile()"
    >{{ label() }}
    @if (isRequired()) {
      <span class="required" aria-hidden="true">*</span>
    }
  </label>
}

<div class="input-container">
  <input
    type="text"
    [id]="fieldId()"
    [value]="value()"
    (blur)="onTouched()"
    (input)="onInputChange($event)"
    #picker="appFlatpickr"
    appFlatpickr
    (dateChanged)="onDateSelect($event)"
    placeholder="dd/mm/yyyy"
    autocomplete="off"
    [attr.aria-label]="label() + (isRequired() ? ', required' : '')"
  />
  <button
    appBtn
    preset="iconSmall"
    icon="calendar"
    ariaLabel="Open calendar"
    type="button"
    (click)="picker.toggle()"
  ></button>

  <span class="error-msg" role="alert" aria-live="polite">{{ showError() }}</span>
</div>
