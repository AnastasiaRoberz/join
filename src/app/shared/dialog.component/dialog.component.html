<div class="overlay-content" (click)="$event.stopPropagation()">
  @switch (dialogService.dialogType()) {
    @case ('contact') {
      <app-contact-dialog />
    }
    @case ('task') {
      <app-task-details />
    }
    @case ('task-edit') {
      <app-task-edit [task]="dialogService.selectedItem()" />
    }
  }
</div>
