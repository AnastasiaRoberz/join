<div class="overlay-content" (click)="$event.stopPropagation()">
  <button appBtn preset="iconSmall" icon="x" class="btn-close" (click)="handleClose()"></button>
  @switch (dialogService.dialogType()) {
    @case ('contact') {
      <app-contact-dialog />
    }
    @case ('task') {
      <app-task-details />
    }
    @case ('task-edit') {
      <app-task-edit />
    }
  }
</div>
