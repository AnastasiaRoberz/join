@if (btnIcon() && btnIconPos() === 'left') {
  <svg class="icon" aria-hidden="true" focusable="false">
    <use [attr.href]="'./assets/icons/icons.svg#' + btnIcon()"></use>
  </svg>
}

<span class="btn-label" [attr.data-text]="btnLabel()">
  @if (btnLabel()) {
    {{ btnLabel() }}
  } @else {
    <ng-content></ng-content>
  }
</span>

@if (btnIcon() && btnIconPos() === 'right') {
  <svg class="icon" aria-hidden="true" focusable="false">
    <use [attr.href]="'./assets/icons/icons.svg#' + btnIcon()"></use>
  </svg>
}
