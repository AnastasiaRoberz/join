<div class="input-container">
  @if (label()) {
    <label [attr.for]="id()" [class.is-mobile]="responsiveService.isMobile()">{{ label() }}</label>
  }
  <ng-content select="input, textarea, select" />
  @if (icon()) {
    <svg class="input-icon">
      <use [attr.href]="`./assets/icons/icons.svg#${icon()}`"></use>
    </svg>
  }
  <span class="error-msg">{{ showError() }}</span>
</div>
