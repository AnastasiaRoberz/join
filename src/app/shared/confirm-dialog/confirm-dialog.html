@if (confirmService.request(); as request) {
  <div class="confirm" role="presentation" (click)="confirmService.answer(false)">
    <section
      class="confirm__box"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-text"
      (click)="$event.stopPropagation()"
    >
      <h3 id="confirm-title" class="confirm__title">{{ request.title }}</h3>
      <p id="confirm-text" class="confirm__text">{{ request.message }}</p>
      <div class="confirm__buttons">
        <button appBtn preset="cancel" size="small" (click)="confirmService.answer(false)">
          Cancel
        </button>
        <button appBtn preset="check" size="small" (click)="confirmService.answer(true)">
          {{ request.confirmLabel }}
        </button>
      </div>
    </section>
  </div>
}
