<label [for]="fieldId()">
  <svg aria-hidden="true" focusable="false">
    <use [attr.href]="iconHref()"></use>
  </svg>
  <input
    type="checkbox"
    [id]="fieldId()"
    [checked]="checked()"
    (change)="onInputChange($event)"
  />
</label>
@if (text()) {
  <span class="checkbox-text">{{ text() }}</span>
} @else {
  <ng-content />
}

<span class="error-msg" role="alert" aria-live="polite">{{ showError() }}</span>
