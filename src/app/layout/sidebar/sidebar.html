<div class="sidebar-wrapper">
  @if (!responsiveService.isTablet() && !isShort()) {
    <svg class="nav-logo">
      <use href="./assets/icons/icons.svg#logo"></use>
    </svg>
  }

  <nav>
    <ul>
      @if (userService.currentSession()) {
        @for (item of navList; track item.section) {
          <li>
            <a
              [routerLink]="'/app/' + item.section"
              routerLinkActive="active"
              (click)="onNavClick(item.section)"
            >
              <svg class="nav-icon">
                <use [attr.href]="'./assets/icons/icons.svg#' + item.svgId"></use>
              </svg>
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      } @else {
        <li>
          <a routerLink="/login" routerLinkActive="active">
            <svg class="nav-icon">
              <use href="./assets/icons/icons.svg#log-in"></use>
            </svg>
            <span>Log In</span>
          </a>
        </li>
        <li>
          <a routerLink="/register" routerLinkActive="active">
            <svg class="nav-icon">
              <use href="./assets/icons/icons.svg#sign-up"></use>
            </svg>
            <span>Sign up</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</div>

@if (!responsiveService.isTablet()) {
  <footer app-footer></footer>
}
