<div class="sidebar__wrapper">
  <svg class="nav-logo">
    <use href="./assets/icons/icons.svg#logo"></use>
  </svg>
</div>
<nav class="sidebar__wrapper--nav">
  <ul>
    @for (item of navList; track item.section) {
      <li>
        <a [routerLink]="'/' + item.section" routerLinkActive="active">
          <div class="link-wrapper">
            <svg class="nav-icon">
              <use [attr.href]="'./assets/icons/icons.svg#' + item.svgId"></use>
            </svg>
            <p>{{ item.label }}</p>
          </div>
        </a>
      </li>
    }
  </ul>
</nav>
<div class="sidebar__imprint">
  <a routerLink="/privacy-policy" routerLinkActive="active" class="sidebar__imprint--privacy"
    >Privacy Policy</a
  >
  <a routerLink="/legal-notice" routerLinkActive="active" class="sidebar__imprint--legal"
    >Legal Notice</a
  >
</div>
