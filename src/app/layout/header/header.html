@if (responsiveService.isMobile()) {
  <svg class="logo">
    <use href="./assets/icons/icons.svg#logo"></use>
  </svg>
} @else {
  <p class="title">Kanban Project Management Tool</p>
}

<div class="nav">
  @if (!(navService.currentUrl() === '/help' || responsiveService.isMobile())) {
    <a routerLink="/help">
      <svg class="help-icon">
        <use href="./assets/icons/icons.svg#help"></use>
      </svg>
    </a>
  }

  <button (click)="toggleMenu()">
    <app-user-avatar [user]="null" size="header" />
  </button>
</div>

@if (menuOpen()) {
  <nav>
    @if (responsiveService.isMobile()) {
      <a routerLink="/help" (click)="closeMenu()">Help</a>
    }
    <a routerLink="/legal-notice" (click)="closeMenu()">Legal Notice</a>
    <a routerLink="/privacy-policy" (click)="closeMenu()">Privacy Policy</a>
    <a routerLink="" (click)="closeMenu()">Log Out</a>
  </nav>
}
