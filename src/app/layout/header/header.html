<header class="header">
  <svg class="header__logo">
    <use href="/assets/icons/icons.svg#logo"></use>
  </svg>
  <p class="header__title">Kanban Project Management Tool</p>
  <div class="header__nav">
    @if (!(navService.currentUrl() === '/help')) {
      <a routerLink="/help" class="header__nav--help">
        <svg class="help-icon">
          <use href="/assets/icons/icons.svg#help"></use>
        </svg>
      </a>
    }
    <button class="header__nav--avatar" (click)="toggleMenu()">G</button>
  </div>

  <nav class="header__menu" [class.header__menu--open]="menuOpen()">
    <ul>
      <li class="help-mobile" (click)="closeMenu()">
        <a routerLink="/help">Help</a>
      </li>
      <li (click)="closeMenu()">
        <a routerLink="/legal-notice">Legal Notice</a>
      </li>
      <li (click)="closeMenu()">
        <a routerLink="/privacy-policy">Privacy Policy</a>
      </li>
      <li (click)="closeMenu()">
        <a routerLink="">Log Out</a>
      </li>
    </ul>
  </nav>
</header>
