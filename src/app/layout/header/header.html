@if (responsiveService.isMobile()) {
  <svg class="logo">
    <use href="./assets/icons/icons.svg#logo"></use>
  </svg>
} @else {
  <p class="title">Kanban Project Management Tool</p>
}

<div class="nav">
  @if (!(navService.currentUrl() === '/app/help' || responsiveService.isMobile())) {
    <a routerLink="/app/help">
      <svg class="help-icon">
        <use href="./assets/icons/icons.svg#help"></use>
      </svg>
    </a>
  }
  <button type="button" (click)="toggleMenu()">
    <app-user-avatar [user]="null" size="header" />
  </button>
</div>

@if (menuOpen()) {
  <nav #menuRef>
    <ul>
      @if (responsiveService.isMobile()) {
        <li class="help-mobile" (click)="closeMenu()">
          <a routerLink="/app/help">Help</a>
        </li>
      }
      <li (click)="closeMenu()">
        <a routerLink="/app/legal-notice">Legal Notice</a>
      </li>
      <li (click)="closeMenu()">
        <a routerLink="/app/privacy-policy">Privacy Policy</a>
      </li>
      <li (click)="closeMenu()">
        <a (click)="userService.logOut()">Log Out</a>
      </li>
    </ul>
  </nav>
}
